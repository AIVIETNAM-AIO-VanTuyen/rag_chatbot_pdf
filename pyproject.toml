[project]
name = "rag-chatbot-pdf"
version = "0.2.0"
description = "Chatbot hỏi đáp tài liệu PDF bằng RAG, dùng Google Gemini"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # simplify
    "BLE",  # blind except
    "RET",  # return
]
ignore = [
    "E501",  # độ dài dòng đã do formatter lo
]

[tool.ruff.lint.per-file-ignores]
# View của Streamlit chứa nhiều khối CSS/HTML dài và phải bắt Exception rộng
# để hiển thị lỗi cho người dùng cuối.
"app/ui/*.py" = ["BLE001"]
"tests/*.py" = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
